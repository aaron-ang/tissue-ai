name: Frontend

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Smoke test routes
        run: |
          npx next start -p 3000 &
          for route in / /issues; do
            curl --retry 10 --retry-connrefused --retry-delay 1 -fsS -o /dev/null "http://localhost:3000$route"
            echo "$route OK"
          done
